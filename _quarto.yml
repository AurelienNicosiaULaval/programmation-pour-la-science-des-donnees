project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "defis/*.qmd"
    - "exercices/*.qmd"
    - "gabarits/*.qmd"
    - "ressources/*.qmd"
    - "!modules/"
  resources:
    - assets/documents/exercices-consolidation/**

lang: fr

website:
  title: "STT-4230 / STT-6230"
