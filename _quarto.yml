project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "defis/*.qmd"
    - "gabarits/*.qmd"
    - "ressources/*.qmd"
    - "!modules/"
  resources:
    - assets/documents/exercices-consolidation/**

lang: fr

website:
  title: "STT-4230 / STT-6230"
  description: "Programmation pour la science des données"
  site-url: "https://aureliennicosiaulaval.github.io/programmation-pour-la-science-des-donnees/"
  repo-url: "https://github.com/AurelienNicosiaULaval/programmation-pour-la-science-des-donnees"
  llms-txt: true
  page-navigation: true
  search: true
  navbar:
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Calendrier"
        href: calendrier.qmd
      - text: "Évaluations"
        menu:
        - text: "Vue d’ensemble"
          href: evaluations.qmd
        - text: "Défis techniques"
          href: defis.qmd
        - text: "Projet d’équipe"
          href: projets.qmd
        - text: "Portfolio individuel"
          href: portfolio.qmd
        - text: "Site Quarto personnel"
          href: site-personnel.qmd
        - text: "Présentation et revue"
          href: presentation.qmd
        - text: "Règles d’usage de l’IA"
          href: ia.qmd
      - text: "Aide et ressources"
        menu:
        - text: "Exercices"
          href: exercices-consolidation.qmd
        - text: "Autodiagnostic R"
          href: diagnostic-r.qmd
        - text: "Démarrage étudiant"
          href: demarrage.qmd
        - text: "Mise à niveau R"
          href: ressources/mise-a-niveau-r.qmd
        - text: "Plan de cours"
          href: plan-cours.qmd
        - text: "Données autorisées"
          href: donnees.qmd
        - text: "Lectures"
          href: lectures.qmd
        - text: "Ressources techniques"
          href: ressources.qmd
        - text: "Dépendances"
          href: dependances.qmd
        - text: "Soutien technique"
          href: soutien-technique.qmd
        - text: "Communication"
          href: communication.qmd
  page-footer:
    left: "STT-4230 / STT-6230 - Université Laval"
    right: "Contenu sous licence CC BY-NC-SA 4.0, sauf indication contraire."

format:
  html:
    theme:
      light:
        - cosmo
        - assets/css/styles.scss
    toc: true
    toc-depth: 3
    number-sections: false
    html-math-method: mathml
    embed-resources: true

execute:
  freeze: false
